<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Staplero Panel-Makiety</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Clickable mockups for the rebuilt panel: learner side (dashboard, course overview) and admin
   course builder (course list, structure tree + step editor + live preview). Same tokens as kurs-demo.html. */
:root {
  color-scheme: light;
  --white: #fff;
  --g50: #f9fafb; --g100: #f3f4f6; --g200: #e5e7eb; --g300: #d1d5db; --g400: #9ca3af; --g500: #6b7280; --g600: #4b5563; --g700: #374151; --g900: #111827;
  --amber50: #fffbeb; --amber100: #fef3c7; --amber500: #f59e0b; --amber600: #d97706; --amber700: #b45309;
  --primary: #f97706; --primary-hover: #e56a00;
  --green: #16a34a; --green50: #f0fdf4; --green500: #22c55e;
  --red: #dc2626; --red50: #fef2f2;
  --dark: #212121; --dark2: #363636;
  --font: "Inter", system-ui, sans-serif; --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --ease: cubic-bezier(.4, 0, .2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--g50); color: var(--g700); font-family: var(--font); font-size: 15px; line-height: 1.5; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { color: var(--g900); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
svg { display: block; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-s { width: 14px; height: 14px; }

/* mockup switcher (not part of the design) */
.mk-bar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--dark); color: #e5e7eb; font-size: 12.5px; overflow-x: auto; }
.mk-bar b { color: #fff; font-weight: 600; margin-right: 6px; white-space: nowrap; }
.mk-bar button { border: 0; background: var(--dark2); color: #e5e7eb; border-radius: 6px; padding: 5px 10px; white-space: nowrap; font-size: 12.5px; }
.mk-bar button[aria-pressed="true"] { background: var(--primary); color: #fff; }
.mk-bar .sep { width: 1px; height: 18px; background: #555; margin: 0 4px; }

/* app chrome */
.app { min-height: calc(100vh - 38px); display: flex; flex-direction: column; }
.top { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--white); border-bottom: 1px solid var(--g200); position: sticky; top: 38px; z-index: 50; }
.logo { font-family: var(--display); font-size: 24px; color: var(--g900); letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.logo i { width: 10px; height: 10px; background: var(--primary); border-radius: 2px; display: block; }
.top nav { display: flex; gap: 2px; margin-left: 12px; }
.top nav a { padding: 7px 12px; border-radius: 8px; color: var(--g500); text-decoration: none; font-weight: 500; font-size: 14px; }
.top nav a.on { color: var(--g900); background: var(--g100); }
.top .sp { flex: 1; }
.lang { display: flex; gap: 2px; background: var(--g100); border-radius: 8px; padding: 3px; }
.lang button { height: 28px; min-width: 34px; border: 0; border-radius: 6px; background: none; font-size: 12px; font-weight: 600; color: var(--g500); }
.lang button[aria-pressed="true"] { background: var(--white); color: var(--g900); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--dark); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.page { width: 100%; max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; display: grid; gap: 24px; }
.btn { height: 42px; border: 0; border-radius: 8px; padding: 0 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background .2s, box-shadow .2s; }
.btn-p { background: var(--primary); color: #fff; } .btn-p:hover { background: var(--primary-hover); }
.btn-d { background: var(--g900); color: #fff; }
.btn-o { background: var(--white); box-shadow: inset 0 0 0 1.5px var(--g300); color: var(--g900); } .btn-o:hover { box-shadow: inset 0 0 0 1.5px var(--g900); }
.btn-g { background: none; color: var(--g600); } .btn-g:hover { background: var(--g100); }
.btn-s { height: 34px; padding: 0 12px; font-size: 13.5px; }
.card { background: var(--white); border: 1px solid var(--g200); border-radius: 12px; }
.lt { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--g400); }
.muted { color: var(--g500); font-size: 14px; }
.bar { height: 6px; border-radius: 999px; background: var(--g200); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--amber500); border-radius: 999px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--green50); color: var(--green); }
.pill.draft { background: var(--g100); color: var(--g600); }
.pill.warn { background: var(--amber50); color: var(--amber700); }
.pill.dark { background: var(--g900); color: #fff; }

/* learner dashboard */
.hello h1 { font-size: 28px; letter-spacing: -.01em; }
.resume { display: grid; grid-template-columns: 360px 1fr; overflow: hidden; }
.resume .vis { background: var(--dark); display: grid; place-items: center; min-height: 190px; }
.resume .vis svg { width: 82%; height: auto; }
.resume .vis { padding: 0; background: var(--g50); border-right: 1px solid var(--g100); } .resume .vis img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.img { overflow: hidden; background: var(--g50); box-shadow: inset 0 0 0 1px var(--g200); } .thumb.img img { width: 100%; height: 100%; object-fit: cover; object-position: 60% 70%; transform: scale(1.7); }
.wallet { display: flex; gap: 8px; flex-wrap: wrap; }
.wbtn { height: 42px; padding: 0 14px; border-radius: 8px; border: 0; background: var(--white); color: var(--g900); box-shadow: inset 0 0 0 1.5px var(--g300); font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 9px; }
.wbtn:hover { box-shadow: inset 0 0 0 1.5px var(--g900); }
.wbtn.pdf { background: var(--primary); color: #fff; box-shadow: none; } .wbtn.pdf:hover { background: var(--primary-hover); }
.certcard { display: grid; grid-template-columns: 220px 1fr; overflow: hidden; }
.certcard .face { position: relative; background: var(--amber50); color: var(--g900); padding: 18px; display: grid; gap: 6px; align-content: space-between; min-height: 150px; border-right: 1px solid var(--amber100); overflow: hidden; }
.certcard .face b { font-family: var(--display); font-size: 26px; line-height: 1; position: relative; }
.certcard .face span { font-size: 12px; color: var(--amber700); position: relative; }
.certcard .face.off { background: var(--g50); border-right-color: var(--g100); }
.certcard .face.off b { color: var(--g400); } .certcard .face.off span { color: var(--g400); }
.certcard .body { padding: 18px 20px; display: grid; gap: 10px; align-content: center; }
.form2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 860px) {
  .certcard, .form2 { grid-template-columns: 1fr; }
  .table.resp thead { display: none; }
  .table.resp tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; border-bottom: 1px solid var(--g100); }
  .table.resp tr:last-child { border-bottom: 0; }
  .table.resp td { padding: 0; border: 0; }
  .table.resp td:nth-child(1) { grid-column: 1; } .table.resp td:nth-child(4) { grid-column: 2; grid-row: 1; text-align: right; font-weight: 600; color: var(--g900); }
  .table.resp td:nth-child(2) { grid-column: 1 / -1; } .table.resp td:nth-child(3) { display: none; }
  .table.resp td:nth-child(5) { grid-column: 1; align-self: center; } .table.resp td:nth-child(6) { grid-column: 2; text-align: right; }
}
.resume .body { padding: 22px 24px; display: grid; gap: 12px; align-content: center; }
.resume h2 { font-size: 22px; }
.resume .row { display: flex; align-items: center; gap: 12px; }
.resume .row .bar { flex: 1; max-width: 320px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.cc { padding: 18px; display: grid; gap: 10px; }
.cc h3 { font-size: 16px; }
.cc .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--g500); }
.side2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--g100); }
.list-row:first-child { border-top: 0; }
.list-row .t { flex: 1; min-width: 0; }
.list-row b { display: block; color: var(--g900); font-size: 14.5px; font-weight: 600; }
.list-row span.s { font-size: 13px; color: var(--g500); }
.dt { width: 46px; text-align: center; flex: none; }
.dt b { font-family: var(--display); font-size: 24px; line-height: 1; }
.dt span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--g500); }
.box-hd { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--g100); }
.box-hd h3 { font-size: 15px; }

/* course overview */
.co-hd { display: grid; grid-template-columns: 1fr 280px; gap: 24px; align-items: start; }
.co-hd h1 { font-family: var(--display); font-size: 44px; line-height: 1; }
.stat { padding: 18px; display: grid; gap: 12px; }
.stat .big { font-family: var(--display); font-size: 40px; color: var(--g900); line-height: 1; }
.chap { overflow: hidden; }
.chap-hd { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 0; background: none; text-align: left; }
.chap-hd .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; border: 2px solid var(--g300); color: var(--g500); }
.chap.cur .chap-hd .n { border-color: var(--amber500); color: var(--amber700); }
.chap.done .chap-hd .n { border-color: var(--green); background: var(--green); color: #fff; }
.chap.lock .chap-hd { color: var(--g400); }
.chap-hd .t { flex: 1; min-width: 0; }
.chap-hd b { display: block; color: var(--g900); font-size: 15.5px; }
.chap.lock .chap-hd b { color: var(--g400); }
.chap-hd .s { font-size: 13px; color: var(--g500); }
.chap-hd .chev { transition: transform .2s; color: var(--g400); }
.chap.open .chev { transform: rotate(180deg); }
.lessons { display: none; border-top: 1px solid var(--g100); padding: 6px 0; }
.chap.open .lessons { display: block; }
.les { display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 62px; color: var(--g700); text-decoration: none; }
a.les:hover { background: var(--g50); }
.les .st { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--g300); flex: none; display: grid; place-items: center; }
.les.done .st { background: var(--green); border-color: var(--green); color: #fff; }
.les.cur .st { border-color: var(--amber500); background: var(--amber500); color: #fff; }
.les .t { flex: 1; font-size: 14.5px; }
.les.cur .t { color: var(--g900); font-weight: 600; }
.les .d { font-size: 12.5px; color: var(--g400); }
.les.test .t { color: var(--amber700); font-weight: 600; }
.cert { display: flex; gap: 16px; align-items: center; padding: 18px; background: var(--dark); color: #e5e7eb; border: 0; }
.cert h3 { color: #fff; font-size: 16px; }

/* admin */
.adm { display: grid; grid-template-columns: 232px 1fr; flex: 1; }
.adm-nav { background: var(--white); border-right: 1px solid var(--g200); padding: 16px 12px; display: grid; gap: 18px; align-content: start; }
.adm-nav .grp { display: grid; gap: 2px; }
.adm-nav .lt { padding: 0 10px 4px; }
.adm-nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--g600); text-decoration: none; font-weight: 500; font-size: 14px; }
.adm-nav a:hover { background: var(--g50); }
.adm-nav a.on { background: var(--amber50); color: var(--amber700); }
.adm-main { min-width: 0; }
.page-hd { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-hd h1 { font-size: 24px; }
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--g400); padding: 10px 16px; border-bottom: 1px solid var(--g200); }
.table td { padding: 14px 16px; border-bottom: 1px solid var(--g100); vertical-align: middle; font-size: 14px; }
.table tr:last-child td { border-bottom: 0; }
.table tr.click { cursor: pointer; } .table tr.click:hover td { background: var(--g50); }
.ctitle { display: flex; gap: 12px; align-items: center; }
.thumb { width: 44px; height: 44px; border-radius: 8px; background: var(--dark); display: grid; place-items: center; flex: none; }
.thumb i { width: 14px; height: 14px; background: var(--primary); border-radius: 3px; display: block; }
.ctitle b { display: block; color: var(--g900); }
.ctitle span { font-size: 13px; color: var(--g500); }
.langs { display: flex; gap: 4px; }
.lg { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--green50); color: var(--green); }
.lg.part { background: var(--amber50); color: var(--amber700); }
.lg.none { background: var(--g100); color: var(--g400); }
.empty { padding: 28px; text-align: center; display: grid; gap: 10px; justify-items: center; border: 1.5px dashed var(--g300); border-radius: 12px; background: var(--white); }

/* builder */
.bld { display: grid; grid-template-rows: auto 1fr; height: calc(100vh - 38px); }
.bld-top { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 60px; background: var(--white); border-bottom: 1px solid var(--g200); }
.crumb { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--g500); min-width: 0; }
.crumb a { color: var(--g500); text-decoration: none; }
.crumb b { color: var(--g900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.saved { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--g500); white-space: nowrap; }
.saved i { width: 8px; height: 8px; border-radius: 50%; background: var(--green500); display: block; }
.saved.busy i { background: var(--amber500); }
.bld-lang { display: flex; gap: 2px; background: var(--g100); border-radius: 8px; padding: 3px; }
.bld-lang button { height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: none; font-size: 12.5px; font-weight: 600; color: var(--g500); display: flex; gap: 6px; align-items: center; }
.bld-lang button[aria-pressed="true"] { background: var(--white); color: var(--g900); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.bld-lang em { font-style: normal; font-size: 10.5px; background: var(--amber500); color: #fff; border-radius: 999px; padding: 0 5px; line-height: 16px; }
.bld-body { display: grid; grid-template-columns: 300px minmax(0, 1fr) 400px; min-height: 0; }
.tree { background: var(--white); border-right: 1px solid var(--g200); overflow-y: auto; padding: 12px 8px 40px; }
.tree-ch { margin-bottom: 4px; }
.tree-row { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 8px; font-size: 13.5px; color: var(--g700); position: relative; }
.tree-row:hover { background: var(--g50); }
.tree-row.ch { font-weight: 600; color: var(--g900); }
.tree-row.les { padding-left: 26px; }
.tree-row.step { padding-left: 36px; font-size: 13px; color: var(--g600); }
.tree-row.sel { background: var(--amber50); color: var(--amber700); }
.tree-row .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-row .ty { font-size: 10.5px; font-weight: 600; color: var(--g400); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.tree-row .tyi { color: var(--g400); display: grid; } .tree-row .tyi .ic { width: 15px; height: 15px; }
.tree-row.sel .tyi { color: var(--amber600); }
.tree-row .miss { width: 7px; height: 7px; border-radius: 50%; background: var(--amber500); flex: none; }
.tree-row .mv { display: none; gap: 2px; }
.tree-row:hover .mv, .tree-row.sel .mv { display: flex; }
.tree-row .mv span { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; color: var(--g500); background: var(--white); box-shadow: inset 0 0 0 1px var(--g200); }
.tree-row .mv span:hover { color: var(--g900); }
.tree-add { display: flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--primary); font-weight: 600; font-size: 13px; padding: 6px 8px 6px 44px; border-radius: 8px; width: 100%; }
.tree-add:hover { background: var(--amber50); }
.tree-add.l { padding-left: 26px; }
.editor { overflow-y: auto; padding: 22px 28px 60px; }
.ed-hd { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.ed-hd .ty { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: var(--g900); color: #fff; }
.ed-hd h2 { font-size: 19px; flex: 1; min-width: 0; }
.fld { display: grid; gap: 6px; margin-bottom: 18px; }
.fld > label, .fld > .lab { font-size: 13.5px; font-weight: 600; color: var(--g900); display: flex; justify-content: space-between; }
.fld > label small, .fld > .lab small { font-weight: 400; color: var(--g400); }
.fld input, .fld textarea, .fld select { width: 100%; border: 1.5px solid var(--g300); border-radius: 8px; padding: 9px 12px; background: var(--white); font-size: 14.5px; transition: border-color .15s; }
.fld input:focus, .fld textarea:focus { border-color: var(--g900); outline: none; }
.fld textarea { min-height: 76px; resize: vertical; line-height: 1.45; }
.fld .help { font-size: 12.5px; color: var(--g500); }
.fld .err { font-size: 12.5px; color: var(--red); font-weight: 500; }
.fld.bad input, .fld.bad textarea { border-color: var(--red); }
.src-de { font-size: 13px; color: var(--g500); background: var(--g50); border-radius: 6px; padding: 7px 10px; }
.src-de b { color: var(--g400); font-size: 11px; letter-spacing: .06em; margin-right: 6px; }
.pts { display: grid; gap: 8px; }
.pt { display: grid; grid-template-columns: 26px minmax(0, 150px) minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.pt .n { width: 24px; height: 24px; border-radius: 50%; background: var(--g900); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; margin-top: 8px; }
.pt textarea { min-height: 42px; }
.pt .act { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.pt .act button { width: 26px; height: 20px; border: 0; background: none; color: var(--g400); border-radius: 4px; display: grid; place-items: center; padding: 0; }
.pt .act button:hover { background: var(--g100); color: var(--g900); }
.link-add { border: 0; background: none; color: var(--primary); font-weight: 600; font-size: 13.5px; padding: 4px 0; display: inline-flex; gap: 6px; align-items: center; }
.ai { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--amber50); margin-bottom: 18px; font-size: 14px; color: var(--g900); }
.preview { background: var(--g100); border-left: 1px solid var(--g200); overflow-y: auto; padding: 18px; display: grid; gap: 10px; align-content: start; justify-items: center; }
.preview .lt { justify-self: start; }
.phone { width: 340px; height: 640px; border-radius: 28px; background: var(--white); border: 8px solid var(--g900); overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; }
.ph-top { padding: 12px 16px 8px; display: grid; gap: 8px; }
.ph-top .r { display: flex; justify-content: space-between; font-size: 11px; color: var(--g400); }
.ph-top .r b { color: var(--g900); font-size: 11.5px; }
.segs { display: flex; gap: 2px; } .segs i { flex: 1; height: 3px; border-radius: 2px; background: var(--g200); } .segs i.on { background: var(--amber500); }
.ph-body { overflow-y: auto; padding: 4px 16px 12px; display: grid; gap: 10px; align-content: start; }
.ph-body .q { font-size: 19px; font-weight: 700; line-height: 1.25; color: var(--g900); }
.ph-body .lead { font-size: 13.5px; color: var(--g900); }
.ph-body .kp { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.ph-body .kp li { display: flex; gap: 9px; background: var(--g50); border-radius: 8px; padding: 7px 9px; font-size: 12.5px; line-height: 1.4; }
.ph-body .kp .n { width: 18px; height: 18px; border-radius: 50%; background: var(--g900); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; flex: none; margin-top: 1px; }
.ph-body .kp b { color: var(--g900); }

        `<div class="fld"><span class="lab">Kernpunkte <small>3 bis 5 Punkte · Stichwort wird fett</small></span><div class="pts">${d.points.map((p, i) => `
          <div class="pt"><span class="n">${i + 1}</span><input data-p="${i}" data-pk="k" aria-label="Stichwort ${i + 1}" value="${esc(val(p.k, st.lang))}" placeholder="${st.lang !== 'de' ? esc(p.k.de) : 'Stichwort'}">
          <textarea data-p="${i}" data-pk="v" aria-label="Text ${i + 1}" placeholder="${st.lang !== 'de' ? esc(p.v.de) : ''}">${esc(val(p.v, st.lang))}</textarea>
          <span class="act"><button type="button" aria-label="Punkt nach oben" data-pm="-1" data-i="${i}">${I.up}</button><button type="button" aria-label="Punkt nach unten" data-pm="1" data-i="${i}">${I.down}</button><button type="button" aria-label="Punkt löschen" data-pd="${i}">${I.del}</button></span></div>`).join('')}</div>
          ${d.points.length < 5 ? `<button class="link-add" type="button" id="addPt">${I.plus}Punkt hinzufügen</button>` : '<span class="help">Maximal 5 Punkte, damit die Karte auf einen Bildschirm passt.</span>'}</div>` +
        fieldHTML('merke', 'Merke', d.merke, { area: true, help: 'Ein Satz, den sich Lernende merken sollen. Optional.', req: false }) +
        fieldHTML('src', 'Quelle', d.src, { help: 'Vorschrift oder Grundsatz, z. B. DGUV V68 §7 Abs. 1.' });
    }
    if (s.type === 'sim') {
      return head + `<div class="fld"><label for="simSel">Simulation</label><select id="simSel">${SIMS.map(x => `<option ${x === s.sim ? 'selected' : ''}>${x}</option>`).join('')}</select><span class="help">Simulationen sind fertig programmiert. Du passt hier nur Texte und Werte an.</span></div>` +
        fieldHTML('title', 'Titel', s.t) + `<div class="fld"><span class="lab">Werte</span><div class="src-de">Beispiel Rampe: Fahrt hinauf, Fahrt hinunter, richtige Richtung je Fahrt. Feedbacktexte pro Sprache.</div></div>`;
    }
    return head + fieldHTML('title', 'Titel', s.t) + `<div class="empty"><b>Inhalte dieses Schritts</b><span class="muted">In der Makieta ist nur die Lernkarte „Pflichten des Unternehmers“ voll ausgearbeitet.</span><button class="btn btn-o btn-s" type="button" data-step-go="2">Zur Lernkarte</button></div>`;
  }
  function previewHTML() {
    const s = lesson.stepList[st.sel], l = st.lang, tx = o => esc(o[l] || o.de);
    const n = lesson.stepList.length;
    const UI = { de: ['Zurück', 'Weiter', 'Merke', 'Quelle'], en: ['Back', 'Next', 'Remember', 'Source'], pl: ['Wstecz', 'Dalej', 'Zapamiętaj', 'Źródło'], uk: ['Назад', 'Далі', 'Запам’ятай', 'Джерело'] }[l];
    let body = '', act = `<div class="ph-act"><span class="o">${UI[0]}</span><span class="p">${UI[1]}</span></div>`;
    if (s.type === 'learn' && s.data) {
      const d = s.data;
      body = `<div class="q">${tx(s.t)}</div><p class="lead">${tx(d.lead) || '<span class="placeholder">Einleitung fehlt</span>'}</p>
        <ul class="kp">${d.points.map((p, i) => `<li><span class="n">${i + 1}</span><span><b>${tx(p.k)}</b> ${tx(p.v)}</span></li>`).join('')}</ul>
        ${(d.merke[l] || d.merke.de) ? `<div class="merke"><b>${UI[2]}</b>${tx(d.merke)}</div>` : ''}<p class="src">${UI[3]}: ${tx(d.src)}</p>`;
    } else if (s.type === 'video') body = `<div class="q">${tx(s.t)}</div><div class="video">VIDEO</div>`;
    else if (s.type === 'sort') { body = `<div class="q">${tx(s.t)}</div><div class="stmt">Den Stapler vor Schichtbeginn auf Mängel prüfen</div>`; act = `<div class="ph-act two" style="grid-template-columns:1fr 1fr"><span class="o">Unternehmer</span><span class="d">Fahrer</span></div>`; }
    else if (s.type === 'choice' || s.type === 'question') body = `<div class="q">${tx(s.t)}</div><div class="opt">Antwort A</div><div class="opt">Antwort B</div><div class="opt">Antwort C</div>`;
    else body = `<div class="q">${tx(s.t)}</div><div class="video" style="background:var(--g100);color:var(--g400)">${s.type === 'sim' ? 'SIMULATION: ' + esc(s.sim).toUpperCase() : TYPES[s.type].n.toUpperCase()}</div>`;
    return `<span class="lt">Vorschau · ${l.toUpperCase()} · Handy</span>
      <div class="phone" aria-label="Vorschau"><div class="ph-top"><div class="r"><b>1.2 DGUV Vorschrift 68</b><span>${st.sel + 1} / ${n}</span></div><div class="segs">${lesson.stepList.map((_, i) => `<i class="${i <= st.sel ? 'on' : ''}"></i>`).join('')}</div></div>
      <div class="ph-body">${body}</div>${act}</div>
      <button class="btn btn-o btn-s" type="button" data-toast="Öffnet das Thema wie bei Teilnehmern">${I.eye}Als Teilnehmer testen</button>`;
  }
  function viewBuilder() {
    return `<div class="bld">
      <div class="bld-top"><div class="crumb"><a href="#courses">Kurse</a><span>/</span><b>Staplerschein Theorie</b></div>
        <span class="pill warn" title="Seit der letzten Veröffentlichung geändert">Entwurf · 3 Änderungen</span><span class="sp" style="flex:1"></span>
        <span class="saved ${st.saving ? 'busy' : ''}" id="saved" aria-live="polite"><i></i>${st.saving ? 'Wird gespeichert …' : 'Alle Änderungen gespeichert'}</span>
        <div class="bld-lang" role="group" aria-label="Sprache bearbeiten">${LANGS.map(l => { const m = missing(l); return `<button type="button" data-lang="${l}" aria-pressed="${st.lang === l}">${l.toUpperCase()}${m ? `<em title="${m} Schritte ohne Übersetzung">${m}</em>` : ''}</button>`; }).join('')}</div>
        <button class="btn btn-p btn-s" type="button" id="publish">Veröffentlichen</button></div>
      <div class="bld-body"><nav class="tree" aria-label="Kursstruktur">${treeHTML()}</nav>
        <section class="editor" id="editor">${editorHTML()}</section>
        <aside class="preview" id="preview">${previewHTML()}</aside></div></div>`;
  }

  /* ───────── modals ───────── */
  function openModal(html) { $('modal').innerHTML = html; $('scrim').classList.add('on'); const f = $('modal').querySelector('button, input'); if (f) f.focus(); }
  const closeModal = () => $('scrim').classList.remove('on');
  $('scrim').addEventListener('click', e => { if (e.target.id === 'scrim' || e.target.closest('[data-close]')) closeModal(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  function stepPicker() {
    const grp = (t, keys) => `<div class="types-grp"><span class="lt">${t}</span><div class="types">${keys.map(k => `<button class="tp" type="button" data-add="${k}"><span class="h"><span class="ico">${TYPES[k].i}</span>${TYPES[k].n}</span><p>${TYPES[k].d}</p></button>`).join('')}</div></div>`;
    openModal(`<div class="modal-hd"><div><h2 id="mTitle">Schritt hinzufügen</h2><p class="muted">Wähle, was Lernende auf diesem Bildschirm sehen. Du kannst den Schritt danach jederzeit verschieben.</p></div><button class="btn btn-g btn-s" type="button" data-close aria-label="Schließen">${ic('<path d="M6 6l12 12M18 6L6 18"/>')}</button></div>
      ${grp('Wissen', ['learn', 'video', 'summary'])}${grp('Üben', ['choice', 'sort', 'gap', 'case', 'question', 'hotspot'])}${grp('Erleben', ['sim', 'self'])}`);
  }
  function newCourseModal() {
    openModal(`<div class="modal-hd"><div><h2 id="mTitle">Neuer Kurs</h2><p class="muted">Du kannst alles später ändern. Der Kurs bleibt Entwurf, bis du ihn veröffentlichst.</p></div><button class="btn btn-g btn-s" type="button" data-close aria-label="Schließen">${ic('<path d="M6 6l12 12M18 6L6 18"/>')}</button></div>
      <div class="fld"><label for="nc1">Titel des Kurses</label><input id="nc1" placeholder="z. B. Schubmaststapler Zusatzausbildung"></div>
      <div class="fld"><span class="lab">Vorlage</span><div class="types">${[['Leer', 'Ohne Kapitel starten.'], ['Wie Staplerschein Theorie', 'Kapitel und Themen als Gerüst übernehmen, ohne Inhalte.'], ['Unterweisung', 'Ein Kapitel mit Lernkarten und Abschlussfragen.']].map(([t, d], i) => `<button class="tp" type="button" style="${i === 0 ? 'box-shadow:inset 0 0 0 1.5px var(--g900)' : ''}"><span class="h">${t}</span><p>${d}</p></button>`).join('')}</div></div>
      <div class="fld"><span class="lab">Sprachen</span><div style="display:flex;gap:16px">${['Deutsch (Original)', 'Englisch', 'Polnisch', 'Ukrainisch'].map((l, i) => `<label style="display:flex;gap:6px;align-items:center;font-weight:500"><input type="checkbox" checked ${i === 0 ? 'disabled' : ''} style="width:auto">${l}</label>`).join('')}</div></div>
      <div style="display:flex;justify-content:end;gap:8px"><button class="btn btn-o" type="button" data-close>Abbrechen</button><button class="btn btn-p" type="button" data-close data-toast="Kurs angelegt">Kurs anlegen</button></div>`);
  }
  function publishModal() {
    const miss = LANGS.filter(l => missing(l));
    openModal(`<div class="modal-hd"><div><h2 id="mTitle">Änderungen veröffentlichen?</h2><p class="muted">Teilnehmer sehen die neue Version ab sofort. Ihr Fortschritt bleibt erhalten.</p></div></div>
      <div class="card" style="padding:4px 0">${[['Geändert', '1.2 DGUV Vorschrift 68: Pflichten · 3 Schritte'], ['Neu', 'Video „Einsatzprüfung am echten Stapler“'], ...miss.map(l => ['Hinweis', `${missing(l)} Schritte ohne Übersetzung ${l.toUpperCase()}: Teilnehmer sehen dort Deutsch`])].map(([a, b]) => `<div class="list-row"><span class="pill ${a === 'Hinweis' ? 'warn' : a === 'Neu' ? 'ok' : 'draft'}">${a}</span><div class="t">${b}</div></div>`).join('')}</div>
      <div style="display:flex;justify-content:end;gap:8px"><button class="btn btn-o" type="button" data-close>Abbrechen</button><button class="btn btn-p" type="button" data-close data-toast="Veröffentlicht">Jetzt veröffentlichen</button></div>`);
  }

  /* ───────── render + events ───────── */
  const views = { dash: viewDash, course: viewCourse, certs: viewCerts, orders: viewOrders, profile: viewProfile, courses: viewCourses, builder: viewBuilder };
  function render() {
    if (!views[st.view]) st.view = 'dash';
    $('view').innerHTML = views[st.view]();
    document.querySelectorAll('.mk-bar [data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === st.view)));
    document.querySelectorAll('.mk-bar [data-cv]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cv === st.cover)));
    bind();
  }
  function saveFlash() {
    st.saving = true; const s = $('saved'); if (s) { s.classList.add('busy'); s.innerHTML = '<i></i>Wird gespeichert …'; }
    clearTimeout(saveFlash.t); saveFlash.t = setTimeout(() => { st.saving = false; const s2 = $('saved'); if (s2) { s2.classList.remove('busy'); s2.innerHTML = '<i></i>Alle Änderungen gespeichert'; } }, 700);
  }
  const refreshSide = () => { $('preview').innerHTML = previewHTML(); };
  function bind() {
    document.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { st.openCh = st.openCh === +b.dataset.ch ? -1 : +b.dataset.ch; render(); });
    document.querySelectorAll('[data-open]').forEach(r => r.onclick = () => { location.hash = 'builder'; });
    const nc = $('newCourse'); if (nc) nc.onclick = newCourseModal;
    if (st.view !== 'builder') return;
    document.querySelectorAll('[data-step]').forEach(b => b.onclick = e => {
      const mv = e.target.closest('[data-mv]');
      if (mv) { const i = +mv.dataset.i, j = i + +mv.dataset.mv, a = lesson.stepList; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; st.sel = j; saveFlash(); render(); return; }
      st.sel = +b.dataset.step; render();
    });
    document.querySelectorAll('[data-step-go]').forEach(b => b.onclick = () => { st.sel = +b.dataset.stepGo; render(); });
    document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { st.lang = b.dataset.lang; render(); });
    $('addStep').onclick = stepPicker;
    $('publish').onclick = publishModal;
    const s = lesson.stepList[st.sel];
    const ed = $('editor');
    ed.querySelectorAll('[data-k]').forEach(inp => inp.addEventListener('input', () => {
      const k = inp.dataset.k, target = k === 'title' ? s.t : s.data[k];
      target[st.lang] = inp.value; saveFlash(); refreshSide();
      if (k === 'title') { const row = document.querySelector(`[data-step="${st.sel}"] .tx`); if (row) row.textContent = inp.value || s.t.de; ed.querySelector('.ed-hd h2').textContent = inp.value || s.t.de; }
    }));
    ed.querySelectorAll('[data-p]').forEach(inp => inp.addEventListener('input', () => { s.data.points[+inp.dataset.p][inp.dataset.pk][st.lang] = inp.value; saveFlash(); refreshSide(); }));
    ed.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => { const p = s.data.points, i = +b.dataset.i, j = i + +b.dataset.pm; if (j < 0 || j >= p.length) return; [p[i], p[j]] = [p[j], p[i]]; saveFlash(); render(); });
    ed.querySelectorAll('[data-pd]').forEach(b => b.onclick = () => { s.data.points.splice(+b.dataset.pd, 1); saveFlash(); render(); toast('Punkt gelöscht'); });
    const ap = $('addPt'); if (ap) ap.onclick = () => { s.data.points.push({ k: L(''), v: L('') }); saveFlash(); render(); };
  }
  document.addEventListener('click', e => {
    const add = e.target.closest('[data-add]');
    if (add) { lesson.stepList.splice(st.sel + 1, 0, { type: add.dataset.add, t: L('Neuer Schritt: ' + TYPES[add.dataset.add].n) }); st.sel++; closeModal(); saveFlash(); render(); return; }
    const t = e.target.closest('[data-toast]'); if (t) toast(t.dataset.toast);
  });
  document.querySelectorAll('.mk-bar [data-v]').forEach(b => b.onclick = () => { location.hash = b.dataset.v; });
  document.querySelectorAll('.mk-bar [data-cv]').forEach(b => b.onclick = () => { st.cover = b.dataset.cv; render(); });
  addEventListener('hashchange', () => { st.view = location.hash.slice(1) || 'dash'; render(); scrollTo(0, 0); });
  render();
})();
</script>
</body>
</html>
