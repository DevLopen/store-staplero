<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Staplero Kurs-Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: mirrors the course TopicView (white 56px top bar, 288px course sidebar, slide-in on mobile)
   with a lesson player in the content area: step progress on top, one phone-sized screen per step,
   actions in the thumb zone, answers in a bottom sheet. Single light theme, like the course view. */
:root {
  color-scheme: light;
  --white: #ffffff;
  --g50: #f9fafb; --g100: #f3f4f6; --g200: #e5e7eb; --g300: #d1d5db; --g400: #9ca3af; --g500: #6b7280; --g600: #4b5563; --g700: #374151; --g900: #111827;
  --amber50: #fffbeb; --amber100: #fef3c7; --amber500: #f59e0b; --amber600: #d97706; --amber700: #b45309;
  --primary: #f97706; --primary-hover: #e56a00;
  --green: #16a34a; --green50: #f0fdf4; --green500: #22c55e;
  --red: #dc2626; --red50: #fef2f2;
  --dark: #212121; --dark2: #363636;
  --font: "Inter", system-ui, -apple-system, sans-serif;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --ease: cubic-bezier(.4, 0, .2, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--white); color: var(--g700); font-family: var(--font); font-size: 16px; line-height: 1.55; overflow: hidden; }
h1, h2, h3, p { margin: 0; }
h1, h2 { color: var(--g900); text-wrap: balance; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
svg { display: block; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-s { width: 14px; height: 14px; }

/* shell */
.shell { height: 100%; display: grid; grid-template-rows: 56px 1fr; }
.topbar { position: relative; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--g200); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.tb-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.iconbtn { width: 40px; height: 40px; border: 0; background: none; border-radius: 6px; display: grid; place-items: center; color: var(--g500); flex: none; }
.iconbtn:hover { background: var(--g100); color: var(--g900); }
.home { display: flex; align-items: center; gap: 6px; color: var(--g400); font-size: 14px; flex: none; }
.slash { color: var(--g300); }
.course-t { font-size: 14px; font-weight: 500; color: var(--g700); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-right { display: flex; align-items: center; gap: 12px; flex: none; }
.cprog { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 500; color: var(--g500); font-variant-numeric: tabular-nums; }
.cprog .trk { width: 112px; height: 6px; border-radius: 999px; background: var(--g200); overflow: hidden; }
.cprog .trk i { display: block; height: 100%; background: var(--amber500); border-radius: 999px; transition: width .4s; }
.badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--g500); border: 1px solid var(--g200); border-radius: 999px; padding: 2px 10px; }

.body { position: relative; overflow: hidden; }
.side { position: absolute; top: 0; bottom: 0; left: 0; width: 288px; z-index: 40; background: var(--white); border-right: 1px solid var(--g200); overflow-y: auto; transition: transform .3s var(--ease); }
.shell.closed .side { transform: translateX(-100%); }
.side-hd { padding: 16px; border-bottom: 1px solid var(--g200); background: var(--g50); }
.side-hd .k { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--g400); margin-bottom: 6px; }
.side-hd .t { font-size: 14px; font-weight: 600; color: var(--g900); }
.side nav { padding: 12px 12px 96px; }
.ch { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; margin-bottom: 2px; }
.ch.act { background: var(--amber50); }
.ch .n { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--amber500); display: grid; place-items: center; font-size: 9px; font-weight: 700; color: var(--amber600); flex: none; }
.ch .n.lock { border: 0; background: var(--g200); color: var(--g400); }
.ch span { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--g600); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch.locked span { color: var(--g300); }
.tops { margin-left: 16px; display: grid; gap: 2px; }
.top { width: 100%; display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; border: 0; border-radius: 8px; background: none; text-align: left; transition: background .2s; }
.top:hover { background: var(--g50); }
.top.cur { background: var(--amber50); }
.top .dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--g300); flex: none; margin-top: 2px; }
.top .ic { margin-top: 1px; }
.top.cur .ic { color: var(--amber500); }
.top.done .ic { color: var(--green500); }
.top .tt { font-size: 12px; font-weight: 500; color: var(--g500); line-height: 1.4; min-width: 0; }
.top.cur .tt { color: var(--amber700); }
.top.done .tt { color: var(--green); }
.top .sub { display: block; font-size: 11px; font-weight: 500; color: var(--amber600); margin-top: 2px; }
.top .demo { display: inline-block; font-size: 10px; font-weight: 600; color: var(--amber700); background: var(--amber100); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
.top.quiz { align-items: center; }
.top.quiz .tt, .top.quiz .ic { color: var(--amber600); }
.locked-note { margin: 2px 0 0 36px; font-size: 12px; font-style: italic; color: var(--g300); }
.scrim { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: none; }
.main { position: absolute; inset: 0 0 0 288px; transition: left .3s var(--ease); display: flex; justify-content: center; background: var(--white); }
.shell.closed .main { left: 0; }

/* lesson player */
.lesson { position: relative; width: 100%; max-width: 620px; height: 100%; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
.l-top { padding: 14px 20px 10px; display: grid; gap: 10px; }
.l-row { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.back { height: 32px; padding: 0 12px 0 6px; border: 0; border-radius: 999px; background: var(--g100); display: flex; align-items: center; gap: 2px; color: var(--g900); font-size: 13px; font-weight: 600; flex: none; }
.back .ic { width: 18px; height: 18px; }
.back:hover { background: var(--g200); }
.back:disabled { display: none; }
.nav2 { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.nav2 .btn-o { gap: 4px; }
.vs { display: flex; align-items: center; gap: 8px; background: var(--g50); border-radius: 12px; padding: 16px 12px; }
.vs figure { margin: 0; flex: 1; display: grid; gap: 6px; justify-items: center; }
.vs svg { width: 100%; max-width: 170px; height: auto; }
.vs figcaption { display: grid; justify-items: center; gap: 4px; text-align: center; }
.vs figcaption b { font-size: 14px; color: var(--g900); }
.tag-ok { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--green); background: var(--green50); border-radius: 999px; padding: 2px 9px 2px 6px; }
.tag-ok .ic { width: 13px; height: 13px; stroke-width: 3; }
.tag-q { width: 22px; height: 22px; border-radius: 50%; background: var(--amber500); color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.tag-qt { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--amber700); background: var(--amber50); border-radius: 999px; padding: 2px 9px 2px 4px; }
.tag-qt i { font-style: normal; width: 15px; height: 15px; border-radius: 50%; background: var(--amber500); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
.vs { gap: 12px; align-items: flex-start; }
.vs-x { font-size: 13px; color: var(--g400); font-weight: 600; }
.av svg { width: 100%; height: 100%; }
.av.pic { background: none; overflow: hidden; }
.people { display: grid; gap: 6px; }
.people > div { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: var(--g50); border-radius: 10px; }
.people .av { width: 46px; height: 46px; }
.people b { display: block; font-size: 15px; color: var(--g900); }
.people span { font-size: 13px; color: var(--g500); }
.l-title { font-size: 13px; font-weight: 600; color: var(--g900); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l-count { font-size: 12px; color: var(--g400); font-variant-numeric: tabular-nums; }
.segs { display: flex; gap: 3px; }
.segs i { flex: 1; height: 4px; border-radius: 2px; background: var(--g200); transition: background .3s; }
.segs i.on { background: var(--amber500); }
.screen { overflow-y: auto; padding: 8px 20px 16px; display: flex; flex-direction: column; }
.screen > .in { flex: 1; display: flex; flex-direction: column; gap: 16px; animation: slide .35s var(--ease) both; }
.screen > .in.rev { animation-name: slideb; }
.screen > .in.stay { animation: none; }
@keyframes slide { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slideb { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
.q { font-size: 24px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
.txt { font-size: 16px; color: var(--g600); }
.small { font-size: 13px; color: var(--g500); }
.actions { padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--g100); display: grid; gap: 8px; background: var(--white); }
.btn { height: 52px; border: 0; border-radius: 8px; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: background .2s, opacity .2s, transform .1s, box-shadow .2s; padding: 0 12px; }
.btn:active { transform: scale(.985); }
.btn-p { background: var(--primary); color: #fff; }
.btn-p:hover { background: var(--primary-hover); }
.btn-p:disabled, .btn-d:disabled { background: var(--g200); color: var(--g400); cursor: default; transform: none; }
.btn-o { background: var(--white); color: var(--g900); box-shadow: inset 0 0 0 1.5px var(--g300); }
.btn-o:hover { box-shadow: inset 0 0 0 1.5px var(--g900); }
.btn-o:disabled { opacity: .45; cursor: default; }
.btn-d { background: var(--g900); color: #fff; }
.row-btn { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.row-btn .btn { font-size: 15px; }
.gate-hint { font-size: 12.5px; color: var(--g400); text-align: center; }

/* bottom sheet */
.sheet-scrim { position: absolute; inset: 0; z-index: 5; background: rgba(17,24,39,.25); opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--white); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.12); transform: translateY(105%); transition: transform .32s var(--ease); max-height: 84%; display: flex; flex-direction: column; }
.lesson.sheet-open .sheet { transform: none; }
.lesson.sheet-open .sheet-scrim { opacity: 1; pointer-events: auto; }
.sh-hd { padding: 18px 20px 14px; display: flex; gap: 12px; align-items: center; border-radius: 16px 16px 0 0; }
.sh-hd.ok { background: var(--green50); color: var(--green); }
.sh-hd.no { background: var(--red50); color: var(--red); }
.sh-hd.neu { background: var(--amber50); color: var(--amber700); }
.sh-hd .bi { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.sh-hd.ok .bi { background: var(--green); } .sh-hd.no .bi { background: var(--red); } .sh-hd.neu .bi { background: var(--amber500); }
.sh-hd b { font-size: 17px; display: block; line-height: 1.25; }
.sh-hd span { font-size: 13px; opacity: .85; }
.sh-body { padding: 16px 20px 4px; overflow-y: auto; display: grid; gap: 10px; font-size: 15.5px; color: var(--g700); }
.sh-body ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.sh-body blockquote { margin: 0; padding: 12px 14px; background: var(--g50); border-radius: 8px; font-size: 15px; color: var(--g900); }
.src { font-size: 12.5px; color: var(--g400); }
.sh-act { padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 9; background: var(--g900); color: #fff; font-size: 13.5px; padding: 8px 14px; border-radius: 8px; white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.on { opacity: 1; }

/* shared content */
.hero { background: var(--dark); border-radius: 12px; overflow: hidden; }
.hero svg { width: 100%; height: auto; }
.bp-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s var(--ease) forwards; }
.bp-d2 { animation-delay: .5s; } .bp-d3 { animation-delay: 1.1s; }
.bp-fade { opacity: 0; animation: fade .6s 1.9s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
.h1 { font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1; color: var(--g900); }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13.5px; color: var(--g500); }
.meta span { display: flex; align-items: center; gap: 6px; }
.video { aspect-ratio: 16 / 9; background: var(--g900); border-radius: 12px; display: grid; place-items: center; position: relative; overflow: hidden; }
.video .pl { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; }
.video .pl svg { width: 20px; height: 20px; fill: #fff; margin-left: 3px; }
.video .tag { position: absolute; top: 12px; left: 12px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--amber500); background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 4px; }
.todo { background: var(--g50); border: 1px dashed var(--g300); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--g600); display: grid; gap: 4px; }
.todo b { color: var(--g900); font-weight: 600; }
.av { width: 52px; height: 52px; border-radius: 50%; background: var(--g100); color: var(--g700); display: grid; place-items: center; font-weight: 700; font-size: 16px; flex: none; }
.av.lg { width: 64px; height: 64px; font-size: 20px; background: var(--g900); color: #fff; }
.avatars { display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: var(--white); border: 1px solid var(--g200); border-radius: 12px; padding: 18px; display: grid; gap: 14px; touch-action: pan-y; user-select: none; transition: transform .3s var(--ease); }
.card.drag { transition: none; }
.card-hd { display: flex; gap: 14px; align-items: center; }
.card-hd b { display: block; font-size: 20px; color: var(--g900); line-height: 1.2; }
.card-hd span { font-size: 13.5px; color: var(--g500); }
.facts { display: grid; margin: 0; }
.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-top: 1px solid var(--g100); font-size: 14px; }
.facts dt { color: var(--g500); } .facts dd { margin: 0; color: var(--g900); font-weight: 500; text-align: right; }
.say { background: var(--g50); border-radius: 8px; padding: 12px 14px; font-size: 15px; color: var(--g900); }
.swipe-tip { display: flex; justify-content: space-between; font-size: 12px; color: var(--g400); }
.res-big { display: flex; align-items: baseline; gap: 10px; }
.res-big b { font-family: var(--display); font-weight: 600; font-size: 56px; line-height: 1; color: var(--g900); font-variant-numeric: tabular-nums; }
.list { display: grid; }
.li { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--g100); }
.li .av { width: 36px; height: 36px; font-size: 12px; }
.li .m { flex: 1; min-width: 0; }
.li .m b { display: block; font-size: 14.5px; color: var(--g900); font-weight: 600; }
.li .m span { font-size: 13px; color: var(--g500); }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--green50); color: var(--green); }
.pill.no { background: var(--red50); color: var(--red); }
.mk { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; flex: none; vertical-align: middle; }
.mk .ic { width: 15px; height: 15px; stroke-width: 3; }
.mk.ok { background: var(--green); } .mk.no { background: var(--red); }
.mk.inl { width: 18px; height: 18px; margin: 0 4px 0 8px; }
.mk.inl .ic { width: 11px; height: 11px; }
.mk.inl:first-child { margin-left: 0; }
/* learning cards */
.learn { display: grid; gap: 10px; }
.learn .lead { font-size: 15.5px; color: var(--g900); }
.kp { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.kp li { display: flex; gap: 12px; align-items: flex-start; background: var(--g50); border-radius: 10px; padding: 9px 12px; font-size: 14.5px; color: var(--g700); line-height: 1.4; }
.kp li b { color: var(--g900); }
.kp .n { width: 22px; height: 22px; border-radius: 50%; background: var(--g900); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; margin-top: 1px; }
.merke { display: flex; gap: 12px; align-items: flex-start; background: var(--amber50); border-radius: 10px; padding: 12px 14px; font-size: 15px; color: var(--g900); }
.merke b { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--amber700); margin-bottom: 2px; }
.formula { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--g900); color: #fff; font-weight: 600; font-size: 14px; text-align: center; }
.formula span { color: var(--amber500); }
.lt { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--g400); }
.goal { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid var(--g100); }
.goal:first-child { border-top: 0; padding-top: 0; }
.goal .gt { display: flex; gap: 10px; font-size: 15px; color: var(--g900); font-weight: 500; line-height: 1.4; }
.tn { font-style: normal; font-size: 12px; font-weight: 700; color: var(--amber700); background: var(--amber50); border-radius: 4px; padding: 1px 6px; height: fit-content; margin-top: 1px; flex: none; }
.rate { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rate button { height: 44px; border: 0; border-radius: 8px; background: var(--g100); color: var(--g600); font-weight: 600; font-size: 15px; transition: background .2s, color .2s; }
.rate button[aria-pressed="true"] { background: var(--g900); color: #fff; }
.scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--g400); margin-top: -4px; }
.chart { width: 100%; height: auto; }
.note { background: var(--amber50); border-radius: 8px; padding: 12px 14px; font-size: 14.5px; color: var(--g900); }
.plan { display: grid; }
.pr { display: grid; grid-template-columns: minmax(0, 1fr) 84px 58px; gap: 10px; align-items: center; border: 0; background: none; padding: 7px 4px; border-top: 1px solid var(--g100); text-align: left; font-size: 14px; color: var(--g700); }
.pr:hover { background: var(--g50); }
.pr.k1 { color: var(--g900); font-weight: 600; }
.pr .tr { position: relative; height: 8px; background: var(--g100); border-radius: 999px; }
.pr .rg { position: absolute; top: 0; bottom: 0; background: var(--g300); border-radius: 999px; }
.pr.k1 .rg { background: var(--amber500); }
.pr .pc { white-space: nowrap; font-size: 12.5px; color: var(--g500); text-align: right; font-variant-numeric: tabular-nums; }
.big-n { display: flex; align-items: baseline; gap: 8px; }
.big-n b { font-family: var(--display); font-weight: 600; font-size: 72px; line-height: .9; color: var(--g900); font-variant-numeric: tabular-nums; }
.big-n span { font-size: 15px; color: var(--g500); }
.meter { position: relative; height: 14px; border-radius: 999px; background: var(--g100); }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; transition: width .15s, background .2s; }
.meter .th { position: absolute; left: 70%; top: -6px; bottom: -6px; width: 2px; background: var(--g900); }
.meter-l { position: relative; display: flex; justify-content: space-between; font-size: 12px; color: var(--g400); }
.meter-l b { color: var(--g900); font-weight: 600; position: absolute; left: 70%; transform: translateX(-50%); }
input[type=range] { width: 100%; accent-color: var(--primary); height: 28px; margin: 0; }
.status { font-weight: 600; font-size: 15px; }
.status.ok { color: var(--green); } .status.no { color: var(--red); } .status.warn { color: var(--amber700); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 div { background: var(--g50); border-radius: 8px; padding: 10px 12px; }
.grid2 span { display: block; font-size: 12px; color: var(--g500); }
.grid2 b { font-size: 15px; color: var(--g900); }
.sum { display: grid; gap: 14px; }
.sum div { display: flex; gap: 14px; align-items: flex-start; }
.sum em { font-style: normal; width: 28px; height: 28px; border-radius: 50%; background: var(--g900); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
.sum p { font-size: 15.5px; color: var(--g700); }
.sum p b { color: var(--g900); }

/* 1.1 specific */
.sim { background: var(--g50); border-radius: 12px; overflow: hidden; }
.sim svg { width: 100%; height: auto; }
.toggle { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--g100); border-radius: 10px; padding: 4px; gap: 4px; }
.toggle button { height: 38px; border: 0; border-radius: 7px; background: none; font-size: 14px; font-weight: 600; color: var(--g500); transition: background .2s, color .2s; }
.toggle button[aria-pressed="true"] { background: var(--white); color: var(--g900); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--g500); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 3px; border-radius: 2px; }
.diff { display: grid; gap: 10px; }
.diff div { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 12px; background: var(--g50); }
.diff .di { width: 44px; height: 44px; border-radius: 10px; background: var(--white); display: grid; place-items: center; color: var(--primary); flex: none; }
.diff .di svg { width: 24px; height: 24px; }
.diff b { display: block; color: var(--g900); font-size: 15.5px; }
.diff span { font-size: 13.5px; color: var(--g500); }
.slider { display: grid; gap: 2px; }
.slider .sl-top { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--g600); }
.slider .sl-top b { color: var(--g900); font-variant-numeric: tabular-nums; }
.load-bar { display: grid; gap: 6px; }
.load-bar .lb { position: relative; height: 10px; background: var(--g100); border-radius: 999px; overflow: hidden; }
.load-bar .lb i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; transition: width .15s, background .2s; }
.load-bar .lb-l { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.lever-step { gap: 10px !important; }
.lever-step .q { font-size: 21px; }
.lever-step input[type=range] { height: 24px; }
.mission { font-size: 13.5px; font-weight: 500; color: var(--amber700); background: var(--amber50); border-radius: 8px; padding: 8px 12px; }
.mission.done { color: var(--green); background: var(--green50); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: -6px; }
.presets button { height: 34px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--g100); font-size: 13px; font-weight: 600; color: var(--g700); }
.presets button:hover { background: var(--g200); }
.tipping { animation: tip .6s cubic-bezier(.5,0,.75,0) forwards; }
.tipped { transform: rotate(13deg); }
@keyframes tip { from { transform: rotate(0); } to { transform: rotate(13deg); } }
.stmt { border: 1.5px solid var(--g200); border-radius: 12px; padding: 22px 18px; font-size: 18px; font-weight: 600; color: var(--g900); line-height: 1.4; min-height: 120px; display: flex; align-items: center; transition: background .2s, border-color .2s; }
.stmt.ok { border-color: var(--green); background: var(--green50); }
.stmt.no { border-color: var(--red); background: var(--red50); }
.fb { font-size: 15px; display: grid; gap: 4px; animation: slide .3s var(--ease) both; }
.fb b { font-size: 15px; }
.fb.ok b { color: var(--green); } .fb.no b { color: var(--red); }
.qdots { display: flex; gap: 6px; justify-content: center; }
.qdots i { width: 8px; height: 8px; border-radius: 50%; background: var(--g200); }
.qdots i.ok { background: var(--green500); } .qdots i.no { background: var(--red); } .qdots i.cur { background: var(--amber500); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 0; border-radius: 10px; background: var(--white); box-shadow: inset 0 0 0 1.5px var(--g200); padding: 12px 14px; font-size: 15px; color: var(--g900); min-height: 54px; transition: box-shadow .2s, background .2s; }
.opt:hover { box-shadow: inset 0 0 0 1.5px var(--g400); }
.opt.right { background: var(--green50); box-shadow: inset 0 0 0 2px var(--green); }
.opt.wrong { background: var(--red50); box-shadow: inset 0 0 0 2px var(--red); }
.opt:disabled { cursor: default; }
.gap-text { font-size: 16.5px; line-height: 2.15; color: var(--g900); background: var(--g50); border-radius: 12px; padding: 14px 16px; }
.blank { display: inline-flex; align-items: center; justify-content: center; min-width: 92px; height: 32px; padding: 0 10px; margin: 0 2px; border: 0; border-radius: 6px; background: var(--white); box-shadow: inset 0 -2px 0 var(--amber500); font-size: 15px; font-weight: 600; color: var(--g900); vertical-align: middle; }
.blank.empty { color: var(--g300); }
.blank.right { background: var(--green50); box-shadow: inset 0 0 0 1.5px var(--green); color: var(--green); }
.blank.wrong { background: var(--red50); box-shadow: inset 0 0 0 1.5px var(--red); color: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--white); box-shadow: inset 0 0 0 1.5px var(--g300); font-size: 15px; font-weight: 500; color: var(--g900); transition: opacity .2s; }
.chip:disabled { opacity: .25; cursor: default; }
.reqs { display: grid; gap: 8px; }
.req { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--g50); font-size: 15px; color: var(--g900); }
.req .ck { width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; flex: none; }
.req .ck svg { width: 14px; height: 14px; stroke-width: 3; }
.req.road { background: var(--amber50); animation: pop .35s var(--ease) both; }
.req.road .ck { background: var(--amber500); }
.req small { display: block; font-size: 12.5px; color: var(--g500); }
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

@media (max-width: 767px) {
  .main, .shell.closed .main { left: 0; }
  .shell:not(.closed) .scrim { display: block; }
  .home span, .cprog, .badge { display: none; }
  .q { font-size: 22px; }
  .pr { font-size: 13.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .bp-draw { animation: none; stroke-dashoffset: 0; } .bp-fade { animation: none; opacity: 1; }
  .screen > .in, .req.road, .fb { animation: none; }
  .tipping { animation: none; transform: rotate(13deg); }
}

body { margin: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="shell" id="shell">
  <header class="topbar">
    <div class="tb-left">
      <button class="iconbtn" id="menuBtn" type="button" aria-label="Kursmenü umschalten"><svg class="ic" viewBox="0 0 24 24" id="menuIc"></svg></button>
      <span class="home"><svg class="ic ic-s" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></span>
      <span class="slash">/</span>
      <span class="course-t">Staplerschein Theorie</span>
    </div>
    <div class="tb-right">
      <div class="cprog"><div class="trk"><i id="cBar"></i></div><span id="cPct">0%</span></div>
      <div class="badge"><svg class="ic ic-s" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="dur"></span></div>
    </div>
  </header>
  <div class="body">
    <aside class="side" aria-label="Kursinhalt">
      <div class="side-hd"><p class="k">Kurs</p><p class="t">Staplerschein Theorie</p></div>
      <nav>
        <div class="ch act"><div class="n">1</div><span>Grundlagen &amp; Vorschriften</span></div>
        <div class="tops" id="tops"></div>
        <div class="ch locked" style="margin-top:8px"><div class="n lock"><svg class="ic" viewBox="0 0 24 24" style="width:12px;height:12px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div><span>Kapitel 2</span></div>
        <p class="locked-note">Wird nach Kapitel 1 freigeschaltet</p>
      </nav>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <section class="lesson" id="lesson">
        <div class="l-top">
          <div class="l-row">
            <button class="back" id="back" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Zurück</button>
            <div class="l-title" id="lTitle"></div>
            <div class="l-count" id="count"></div>
          </div>
          <div class="segs" id="segs"></div>
        </div>
        <div class="screen" id="screen"></div>
        <div class="actions" id="actions"></div>
        <div class="sheet-scrim" id="sheetScrim"></div>
        <div class="sheet" id="sheet" role="dialog" aria-live="polite"></div>
        <div class="toast" id="toast"></div>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const I = {
    check: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    x: '<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    info: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    next: '<svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
    play: '<svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg>',
    clock: '<svg class="ic ic-s" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    users: '<svg class="ic ic-s" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.5-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.8.7 3 2.6 3.5 5.2"/></svg>',
    doc: '<svg class="ic ic-s" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>',
    playC: '<svg class="ic ic-s" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg>',
    checkC: '<svg class="ic ic-s" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>',
    award: '<svg class="ic ic-s" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 21l5-3 5 3-1.5-7"/></svg>',
    steer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17a8 8 0 0 1 15-4"/><path d="M19 7v6h-6"/></svg>',
    box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M7 20V9h10v11"/><path d="M12 9V4M9.5 6.5L12 4l2.5 2.5"/></svg>',
    lever: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l18-5"/><path d="M12 13l-2 6h4z"/><rect x="16" y="5" width="5" height="5"/></svg>',
  };

  /* ───────── shell ───────── */
  const shell = $('shell');
  const mobile = () => innerWidth < 768;
  const setMenu = open => {
    shell.classList.toggle('closed', !open);
    $('menuIc').innerHTML = open ? '<path d="M6 6l12 12M18 6L6 18"/>' : '<path d="M4 6h16M4 12h16M4 18h16"/>';
  };
  setMenu(!mobile());
  $('menuBtn').onclick = () => setMenu(shell.classList.contains('closed'));
  $('scrim').onclick = () => setMenu(false);
  let tt;
  function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }

  /* ───────── engine ───────── */
  let cur = 'lz', step = 0, dir = 1;
  const done = { lz: false, t11: false };
  const screen = $('screen'), actions = $('actions'), lesson = $('lesson');

  function go(n) {
    closeSheet();
    if (n >= T[cur].steps.length) return;
    dir = n >= step ? 1 : -1;
    step = Math.max(0, n);
    render();
  }
  function openTopic(k, s = 0) { cur = k; step = s; dir = 1; closeSheet(); if (mobile()) setMenu(false); render(); }
  function render(stay) {
    const t = T[cur], st = t.steps, s = st[step];
    $('lTitle').textContent = t.title;
    $('dur').textContent = t.dur;
    $('count').textContent = `${step + 1} / ${st.length}`;
    $('segs').innerHTML = st.map((_, i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('');
    $('back').disabled = step === 0;
    const seen = (done.lz ? T.lz.steps.length : cur === 'lz' ? step : 0) + (done.t11 ? T.t11.steps.length : cur === 't11' ? step : 0);
    const pct = Math.round(seen / 180 * 100);
    $('cBar').style.width = Math.max(1, pct) + '%'; $('cPct').textContent = pct + '%';
    renderTopics();
    if (!stay) screen.scrollTop = 0;
    screen.innerHTML = `<div class="in ${stay ? 'stay' : dir < 0 ? 'rev' : ''}">${s.r()}</div>`;
    if (s.a) s.a(); else setActions(nextBtn());
  }
  const rerender = () => render(true);
  function nextBtn(label = 'Weiter', disabled = false) {
    return `<button class="btn btn-p" type="button" id="nx" ${disabled ? 'disabled' : ''}>${label}${I.next}</button>`;
  }
  function setActions(html, hint) {
    if (step > 0 && /^<button[^>]*id="nx"/.test(html.trim())) {
      html = `<div class="nav2"><button class="btn btn-o" type="button" id="bk"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Zurück</button>${html}</div>`;
    }
    actions.innerHTML = html + (hint ? `<p class="gate-hint">${hint}</p>` : '');
    const nx = $('nx'); if (nx) nx.onclick = () => go(step + 1);
    const bk = $('bk'); if (bk) bk.onclick = () => go(step - 1);
  }
  function gated(ok, hint, extra = '') { setActions(extra + nextBtn('Weiter', !ok), ok ? '' : hint); }
  function unlock() { const n = $('nx'); if (n) n.disabled = false; const h = actions.querySelector('.gate-hint'); if (h) h.remove(); }
  $('back').onclick = () => go(step - 1);
  addEventListener('keydown', e => {
    if (e.target.matches('input')) return;
    if (e.key === 'ArrowLeft' && step > 0) go(step - 1);
    if (e.key === 'ArrowRight') { const nx = $('nx'); if (nx && !nx.disabled) nx.click(); }
  });
  function openSheet(kind, title, sub, body, btnLabel, onBtn) {
    const icon = kind === 'ok' ? I.check : kind === 'no' ? I.x : I.info;
    $('sheet').innerHTML = `<div class="sh-hd ${kind}"><div class="bi">${icon}</div><div><b>${title}</b>${sub ? `<span>${sub}</span>` : ''}</div></div>
      <div class="sh-body">${body}</div><div class="sh-act"><button class="btn btn-p" type="button" id="shBtn">${btnLabel}</button></div>`;
    $('shBtn').onclick = onBtn;
    lesson.classList.add('sheet-open');
  }
  function closeSheet() { lesson.classList.remove('sheet-open'); }
  $('sheetScrim').onclick = closeSheet;

  const topicList = [
    ['lz', 'Lernziele'],
    ['t11', '1.1 Warum eine Ausbildung vorgeschrieben ist'],
    [null, '1.2 DGUV Vorschrift 68 – Pflichten des Unternehmers und Fahrers'],
    [null, '1.3 Rechtliche Grundlagen (ArbSchG, BetrSichV, StVO, StVZO etc.)'],
    [null, '1.4 Folgen von Fehlverhalten – Haftung, Strafen, Personenschäden'],
    [null, '1.5 Aufbau und Aussehen des Staplerscheins'],
    [null, '1.6 Das Stufensystem nach DGUV G308-001'],
  ];
  function renderTopics() {
    $('tops').innerHTML = topicList.map(([k, t]) => {
      if (k === cur) return `<button class="top cur" type="button" data-k="${k}">${I.playC}<span class="tt">${t}<span class="sub">Schritt ${step + 1} von ${T[k].steps.length}</span></span></button>`;
      if (k && done[k]) return `<button class="top done" type="button" data-k="${k}">${I.checkC}<span class="tt">${t}</span></button>`;
      if (k) return `<button class="top" type="button" data-k="${k}"><span class="dot"></span><span class="tt">${t}<span class="demo">Demo</span></span></button>`;
      return `<button class="top other" type="button"><span class="dot"></span><span class="tt">${t}</span></button>`;
    }).join('') + `<button class="top quiz other" type="button">${I.award}<span class="tt">Test Kapitel 1</span></button>`;
    $('tops').querySelectorAll('[data-k]').forEach(b => b.onclick = () => openTopic(b.dataset.k));
    $('tops').querySelectorAll('.other').forEach(b => b.onclick = () => toast('In der Demo sind „Lernziele“ und 1.1 ausgearbeitet'));
  }

  /* generic sequential quiz: statement + answer buttons, or question + option list */
  function seqQuiz(cfg) {
    cfg.st = { i: 0, res: [], answered: null };
    const finished = () => cfg.st.res.length === cfg.items.length;
    return {
      r: () => {
        const st = cfg.st;
        const dots = `<div class="qdots">${cfg.items.map((_, k) => `<i class="${k < st.res.length ? (st.res[k] ? 'ok' : 'no') : k === st.i ? 'cur' : ''}"></i>`).join('')}</div>`;
        if (finished()) {
          const n = st.res.filter(Boolean).length;
          return `<h2 class="q">${cfg.title}</h2><div class="res-big"><b>${n} / ${cfg.items.length}</b><span class="small">richtig</span></div>
            <p class="txt">${n === cfg.items.length ? cfg.allRight : cfg.someWrong}</p>${dots}`;
        }
        const it = cfg.items[st.i], a = st.answered;
        let body;
        if (cfg.list) {
          body = `<div class="say" style="font-size:17px;font-weight:600">${it.q}</div><div class="opts">${it.o.map((o, k) => {
            const cls = a === null ? '' : k === it.a ? 'right' : k === a ? 'wrong' : '';
            return `<button class="opt ${cls}" type="button" data-k="${k}" ${a !== null ? 'disabled' : ''}>${o}</button>`;
          }).join('')}</div>`;
        } else {
          body = `<div class="stmt ${a === null ? '' : a === it.a ? 'ok' : 'no'}">${it.t}</div>`;
        }
        const fb = a === null ? '' : `<div class="fb ${a === it.a ? 'ok' : 'no'}"><b>${a === it.a ? 'Richtig' : 'Nicht ganz'}${cfg.list ? '' : ': ' + cfg.labels[it.a]}</b><span>${it.why}</span></div>`;
        return `<h2 class="q">${cfg.title}</h2>${cfg.lead && a === null ? `<p class="small">${cfg.lead}</p>` : ''}${body}${fb}${dots}`;
      },
      a: () => {
        const st = cfg.st;
        if (finished()) { setActions(nextBtn()); return; }
        const answer = k => { st.answered = k; rerender(); };
        if (st.answered !== null) {
          setActions(`<button class="btn btn-p" type="button" id="qn">${st.i < cfg.items.length - 1 ? 'Nächste' : 'Auswertung'}${I.next}</button>`);
          $('qn').onclick = () => { st.res[st.i] = st.answered === cfg.items[st.i].a; st.answered = null; if (st.i < cfg.items.length - 1) st.i++; dir = 1; render(); };
          return;
        }
        if (cfg.list) {
          screen.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
          setActions(nextBtn('Weiter', true), 'Wähle eine Antwort');
        } else {
          setActions(`<div class="row-btn">${cfg.labels.map((l, k) => `<button class="btn ${k === cfg.labels.length - 1 ? 'btn-d' : 'btn-o'}" type="button" data-k="${k}">${l}</button>`).join('')}</div>`);
          actions.querySelectorAll('[data-k]').forEach(b => b.onclick = () => answer(+b.dataset.k));
        }
      },
    };
  }

  /* ════════════════ TOPIC: LERNZIELE ════════════════ */
  /* simple person bust: head, hair, work clothing (hi-vis vest with reflective stripes) */
  function person(l) {
    const hair = l.long
      ? `<path d="M19 30q-1-17 13-18 14 1 13 18v14h-5V27q-8 2-16-4v21h-5z" fill="${l.hair}"/>`
      : `<path d="M20 27q-1-14 12-15 13 1 12 15-3-7-12-7t-12 7z" fill="${l.hair}"/>`;
    const beard = l.beard ? `<path d="M23 31q1 9 9 10 8-1 9-10-4 4-9 4t-9-4z" fill="${l.hair}" opacity=".85"/>` : '';
    const vest = l.vest ? `<path d="M15 52h34M13 58h38" stroke="#e5e7eb" stroke-width="2.5"/>` : `<path d="M32 44v20" stroke="rgba(0,0,0,.18)" stroke-width="2"/>`;
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="#eef2f7"/>
      <path d="M8 64q2-20 24-21 22 1 24 21z" fill="${l.top}"/>${vest}
      <rect x="28" y="36" width="8" height="8" fill="${l.skin}"/>
      <circle cx="32" cy="28" r="11" fill="${l.skin}"/>${hair}${beard}</svg>`;
  }
  const cases = [

  {
